services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: english_edu
      POSTGRES_USER: english_edu
      POSTGRES_PASSWORD: english_edu
    ports:
      - "5432:5432"
    volumes:
      - english_edu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_edu -d english_edu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  english_edu_pg:
