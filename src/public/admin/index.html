<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Edu Admin</title><style>
:root{--bg:#090909;--card:#141414;--line:#2a2a2a;--text:#f7f7f7;--muted:#969696;--gold:#ffae00;--danger:#ff5b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ffc633,#ff8a00);color:#171006;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.login{max-width:420px;margin:12vh auto}.login h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric b{display:block;font-size:30px}.metric span{color:var(--muted)}input{width:100%;padding:13px 14px;border:1px solid #3a3a3a;background:#0d0d0d;color:#fff;border-radius:12px;margin:6px 0 12px}button{min-height:42px;border:1px solid #3a3a3a;background:#1d1d1d;color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer}button.primary{background:linear-gradient(135deg,#ffbd32,#ff9400);color:#1b1200;border:0;font-weight:800;width:100%}button.danger{color:#ff8d88}.table{margin-top:16px;overflow:auto}.toolbar{display:flex;gap:8px;margin:22px 0 0}.toolbar input{margin:0;max-width:360px}table{width:100%;border-collapse:collapse;min-width:740px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#222}.error{color:#ff8d88;margin-top:10px}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.shell{padding:18px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.toolbar{flex-direction:column}.toolbar input{max-width:none}}
</style></head><body><main class="shell"><section id="login" class="card login"><div class="brand"><div class="mark">E</div><div><h1>Admin login</h1><div class="muted">English Edu management</div></div></div><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary">Sign in</button><div id="loginError" class="error"></div></form></section><section id="dashboard" class="hidden"><header class="top"><div class="brand"><div class="mark">E</div><div><b>English Edu Admin</b><div class="muted">Users and learning activity</div></div></div><button id="logout">Log out</button></header><div id="metrics" class="grid"></div><div class="toolbar"><input id="search" placeholder="Search by name or email"><button id="searchButton">Search</button></div><div class="card table"><table><thead><tr><th>User</th><th>XP</th><th>Streak</th><th>Lessons</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('englishEduAdminToken')||'';const api=async(path,options={})=>{const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...options.headers}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data};
async function load(){try{const [{stats},{users}]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users?limit=50')]);$('metrics').innerHTML=[['Users',stats.total_users],['New this week',stats.new_users_7d],['Active today',stats.active_users_24h],['Total XP',stats.total_xp],['Average XP',stats.average_xp],['Open mistakes',stats.unresolved_mistakes],['Difficult words',stats.difficult_words]].map(x=>`<article class="card metric"><b>${x[1]}</b><span>${x[0]}</span></article>`).join('');renderUsers(users);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden')}catch(e){logout()}}
function renderUsers(users){$('users').innerHTML=users.map(u=>`<tr><td><b>${escapeHtml(u.display_name)}</b><div class="muted">${escapeHtml(u.email)}</div></td><td>${u.xp||0}</td><td>${u.streak||0}</td><td>${Array.isArray(u.completed_lessons)?u.completed_lessons.length:0}</td><td>${new Date(u.created_at).toLocaleDateString()}</td><td><span class="pill">${u.is_active?'Active':'Disabled'}</span></td><td>${u.role==='admin'?'Admin':`<button class="${u.is_active?'danger':''}" onclick="setStatus('${u.id}',${!u.is_active})">${u.is_active?'Disable':'Enable'}</button>`}</td></tr>`).join('')}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function setStatus(id,isActive){await api(`/api/admin/users/${id}/status`,{method:'PATCH',body:JSON.stringify({isActive})});await search()}async function search(){const q=encodeURIComponent($('search').value);const data=await api(`/api/admin/users?limit=50&search=${q}`);renderUsers(data.users)}function logout(){token='';localStorage.removeItem('englishEduAdminToken');$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{const data=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error);return d});if(data.user.role!=='admin')throw new Error('Admin access required');token=data.token;localStorage.setItem('englishEduAdminToken',token);await load()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=logout;$('searchButton').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};if(token)load();
</script></body></html>
